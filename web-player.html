<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWE Web Player</title><style>:root{--bg:#050912;--p:#0a1422;--l:#1d334a;--t:#f4f8ff;--m:#8fa6bd;--a:#20c8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui;height:100vh;display:flex;flex-direction:column}.bar{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #ffffff12;background:#050912;flex-wrap:wrap}.url{flex:1;min-width:220px;background:#0a1625;color:#fff;border:1px solid var(--l);border-radius:999px;padding:11px 15px}.btn{background:#0d1b2d;border:1px solid var(--l);color:#eaf7ff;padding:9px 12px;border-radius:9px;cursor:pointer;text-decoration:none}.btn.primary{background:var(--a);color:#00131b;font-weight:900}.frame{flex:1;border:0;width:100%;background:#fff}.notice{padding:35px;text-align:center;color:var(--m);max-width:760px;margin:auto;line-height:1.7}.small{font-size:12px;color:#6f8499}</style></head><body><div class="bar"><b>AWE WEB</b><button class="btn" onclick="go(-1)">←</button><button class="btn" onclick="go(1)">→</button><button class="btn" onclick="reload()">↻</button><input id="url" class="url" placeholder="https://example.com"><button class="btn primary" onclick="openSite()">Open</button><a class="btn" href="index.html">Archive</a></div><div id="box" style="flex:1;display:flex;flex-direction:column"><iframe id="frame" class="frame" sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts"></iframe></div><script>const q=new URLSearchParams(location.search),initial=q.get('url')||'';url.value=initial;let historyUrls=initial?[initial]:[],pos=initial?0:-1;function valid(x){try{const u=new URL(x);return u.protocol==='http:'||u.protocol==='https:'}catch{return false}}function openSite(push=true){let x=url.value.trim();if(!/^https?:\/\//i.test(x))x='https://'+x;if(!valid(x)){alert('Invalid web URL');return}if(push){historyUrls=historyUrls.slice(0,pos+1);historyUrls.push(x);pos=historyUrls.length-1}url.value=x;frame.src=x}function go(d){const n=pos+d;if(n<0||n>=historyUrls.length)return;pos=n;url.value=historyUrls[pos];frame.src=historyUrls[pos]}function reload(){try{frame.contentWindow.location.reload()}catch{frame.src=url.value}}url.addEventListener('keydown',e=>{if(e.key==='Enter')openSite()});if(initial)openSite(false);</script></body></html>
