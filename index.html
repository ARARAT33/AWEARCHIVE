<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8fbff"><title>AWEARCHIVE · AWELIB</title><style>:root{--bg:#f7faff;--panel:#ffffffb8;--panel2:#ffffffd9;--line:#dce6f3;--text:#172033;--muted:#64748b;--a:#4f7cff;--b:#b56cff;--c:#20c8ff;--shadow:0 20px 60px #5271a51c}*{box-sizing:border-box}body{margin:0;color:var(--text);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 8% 0%,#d9f4ff 0,transparent 30%),radial-gradient(circle at 92% 5%,#eadcff 0,transparent 30%),linear-gradient(135deg,#fbfdff,#f2f7ff);min-height:100vh}body:before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(circle at 35% 35%,#78d9ff2b,transparent 28%),radial-gradient(circle at 70% 60%,#c084fc24,transparent 30%);filter:blur(55px)}.wrap{width:min(1500px,calc(100% - 28px));margin:auto}.top{position:sticky;top:0;z-index:20;background:#ffffffa8;border-bottom:1px solid #ffffffcc;backdrop-filter:blur(24px) saturate(160%);box-shadow:0 8px 30px #5b78a512}.nav{min-height:72px;display:flex;align-items:center;gap:12px}.brand{color:var(--text);text-decoration:none;font-weight:950;font-size:19px}.logo{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--c),var(--b),var(--a));color:#fff;box-shadow:0 10px 28px #8b6cff38;margin-right:8px}.search{flex:1}.search input{width:100%;padding:14px 18px;border:1px solid #d9e4f2;border-radius:999px;background:#ffffffb8;color:var(--text);outline:0;box-shadow:inset 0 1px #fff,0 8px 25px #5572a00d}.search input:focus{border-color:#8ab6ff;box-shadow:0 0 0 4px #6aa6ff16}.nav a:not(.brand){color:#52627a;font-weight:850;text-decoration:none}.hero{text-align:center;padding:78px 0 38px}.ey{color:#5274e8;font-weight:950;letter-spacing:.18em;font-size:11px}.hero h1{font-size:clamp(44px,8vw,84px);line-height:.94;margin:15px 0;letter-spacing:-.055em}.hero h1 span{background:linear-gradient(100deg,#19bde9,#6b76ff,#c266ff);-webkit-background-clip:text;color:transparent}.hero p{max-width:820px;margin:auto;color:var(--muted);font-size:18px;line-height:1.65}.stats{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:27px 0}.stat{border:1px solid #fff;background:#ffffffa6;backdrop-filter:blur(15px);box-shadow:var(--shadow);padding:11px 16px;border-radius:16px;color:var(--muted)}.stat b{color:var(--text)}.tools{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip,.select,.btn{border:1px solid #dce6f3;background:#ffffffb8;color:#334155;border-radius:12px;padding:10px 13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font-weight:800;box-shadow:0 7px 22px #5271a50c;backdrop-filter:blur(12px)}.chip.active,.btn.primary{background:linear-gradient(135deg,#5d8dff,#9b6cff);color:#fff;border-color:transparent;box-shadow:0 12px 28px #7c78ff2e}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}.card{background:#ffffffb8;border:1px solid #ffffff;backdrop-filter:blur(18px) saturate(130%);border-radius:21px;overflow:hidden;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}.card:hover{transform:translateY(-6px) scale(1.01);border-color:#a8c7ff;box-shadow:0 24px 55px #5271a522}.thumb{height:175px;display:grid;place-items:center;background:linear-gradient(135deg,#eaf7ff,#f1eaff);font-size:48px;color:#7991b5;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.type{color:#5779e8;font-size:10px;font-weight:950;text-transform:uppercase;letter-spacing:.12em}.title{font-weight:900;font-size:16px;margin:6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.desc{height:42px;color:var(--muted);overflow:hidden;line-height:1.4}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.tag{font-size:10px;padding:5px 8px;background:#edf4ff;border-radius:8px;color:#59708e}.empty{text-align:center;padding:80px;color:var(--muted);border:1px dashed #cbd8e8;border-radius:18px;grid-column:1/-1;background:#ffffff80}.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:15px;background:#dce8f499;backdrop-filter:blur(20px)}.modal.show{display:grid}.dialog{width:min(1120px,100%);max-height:93vh;overflow:auto;background:#ffffffed;border:1px solid #fff;border-radius:27px;padding:20px;box-shadow:0 30px 100px #526b932b}.head{display:flex;justify-content:space-between;gap:15px}.close{width:40px;height:40px;border:1px solid #dce6f3;background:#f4f8ff;color:#334155;border-radius:12px;font-size:22px}.preview{min-height:300px;margin:16px 0;border:1px solid #dce6f3;border-radius:19px;background:linear-gradient(135deg,#f5faff,#faf6ff);display:grid;place-items:center;overflow:hidden}.preview img,.preview video{max-width:100%;max-height:67vh}.hint{padding:60px;text-align:center;color:var(--muted);line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap}.footer{margin:55px 0 20px;padding:20px 0;border-top:1px solid #dce6f3;color:var(--muted);display:flex;justify-content:space-between}@media(max-width:1200px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.nav{flex-wrap:wrap;padding:10px 0}.search{order:3;flex-basis:100%}.grid{grid-template-columns:repeat(2,1fr)}.thumb{height:140px}.footer{display:block}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="/"><span class="logo">A</span>AWEARCHIVE <small style="color:#617df0">· AWELIB</small></a><div class="search"><input id="q" placeholder="Search archive…"></div><a href="admin.html">Admin</a></div></header><main class="wrap"><section class="hero"><div class="ey">AWE ARCHIVE NETWORK</div><h1>Knowledge, <span>preserved.</span></h1><p>One beautiful static archive for media, files, webpages and development resources — with specialized viewers for every kind of content.</p><div class="stats"><div class="stat"><b id="count">0</b> items</div><div class="stat"><b id="types">0</b> types</div><div class="stat"><b id="tags">0</b> tags</div></div></section><section><div class="tools"><div id="chips" class="chips"></div><select id="sort" class="select"><option value="new">Newest</option><option value="old">Oldest</option><option value="az">A–Z</option><option value="za">Z–A</option></select></div><div id="grid" class="grid"></div></section><footer class="footer"><span>© 2026 AWEARCHIVE · AWELIB</span><span>AWE Media · Web Player · VS Code Web</span></footer></main><div id="modal" class="modal"><article class="dialog"><div class="head"><div><div id="mt" class="type"></div><h2 id="mh"></h2></div><button class="close" onclick="closeM()">×</button></div><div id="pv" class="preview"></div><p id="md" style="color:var(--muted);line-height:1.6"></p><div id="mg" class="tags"></div><div id="act" class="actions" style="margin-top:15px"></div></article></div><script>const DATA='https://raw.githubusercontent.com/ARARAT33/AWEArchiveDB/main/archive.json';let items=[],filter='all';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function youtube(u){try{const x=new URL(u);if(x.hostname.includes('youtu.be'))return x.pathname.slice(1);if(x.hostname.includes('youtube.com'))return x.searchParams.get('v')||((x.pathname.match(/embed\/([^/]+)/)||[])[1]);}catch{}return null}function ext(u){try{return new URL(u).pathname.split('.').pop().toLowerCase()}catch{return''}}function mediaType(x){const e=ext(x.url||'');if(['jpg','jpeg','png','gif','webp','svg','avif','bmp'].includes(e)||x.type==='image')return'image';if(['mp4','webm','ogv','mov','m4v'].includes(e)||x.type==='video')return'video';if(['mp3','wav','ogg','m4a','aac','flac'].includes(e)||x.type==='audio')return'audio';return null}async function load(){try{const r=await fetch(DATA,{cache:'no-store'});items=(await r.json()).filter(x=>x&&x.status!=='hidden');count.textContent=items.length;types.textContent=new Set(items.map(x=>x.type).filter(Boolean)).size;tags.textContent=new Set(items.flatMap(x=>x.tags||[])).size;build();render()}catch{grid.innerHTML='<div class="empty">Catalog unavailable.</div>'}}function build(){const a=['all',...new Set(items.map(x=>x.type).filter(Boolean))];chips.innerHTML=a.map(x=>`<button class="chip ${x===filter?'active':''}" onclick="filter='${esc(x)}';build();render()">${x==='all'?'All':esc(x)}</button>`).join('')}function render(){const qv=q.value.toLowerCase();let d=items.filter(x=>(filter==='all'||x.type===filter)&&(`${x.title} ${x.description} ${(x.tags||[]).join(' ')}`).toLowerCase().includes(qv));const s=sort.value;if(s==='az')d.sort((a,b)=>(a.title||'').localeCompare(b.title||''));if(s==='za')d.sort((a,b)=>(b.title||'').localeCompare(a.title||''));if(s==='old')d.sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0));if(s==='new')d.sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));grid.innerHTML=d.length?d.map(card).join(''):'<div class="empty">No results.</div>'}function card(x){const t=x.type||'file',ic=t==='video'?'▶':t==='audio'?'♫':t==='image'?'▧':t==='webpage'?'🌐':t==='file'?'▤':'◆';return`<article class="card" onclick="openM('${esc(x.id)}')"><div class="thumb">${x.thumbnail?`<img src="${esc(x.thumbnail)}" loading="lazy" alt="">`:ic}</div><div class="body"><div class="type">${esc(t)}</div><div class="title">${esc(x.title)}</div><div class="desc">${esc(x.description)}</div><div class="tags">${(x.tags||[]).slice(0,5).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></div></article>`}function openM(id){const x=items.find(a=>a.id===id);if(!x)return;const u=x.url||'',yt=youtube(u),mtx=mediaType(x);mt.textContent=x.type||'file';mh.textContent=x.title||'';md.textContent=x.description||'';mg.innerHTML=(x.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('');pv.innerHTML='';act.innerHTML='';if(yt){pv.innerHTML=`<iframe style="width:100%;height:67vh;border:0;border-radius:14px" src="https://www.youtube.com/embed/${esc(yt)}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;act.innerHTML+=`<a class="btn primary" href="https://www.youtube.com/watch?v=${encodeURIComponent(yt)}" target="_blank" rel="noopener noreferrer">▶ YouTube ↗</a>`}else if(mtx==='image'){pv.innerHTML=`<img src="${esc(u)}" alt="">`;act.innerHTML+=`<a class="btn primary" href="media-editor.html?url=${encodeURIComponent(u)}&name=${encodeURIComponent(x.title||'image')}">✎ Edit image</a>`}else if(mtx==='video'){pv.innerHTML=`<video controls autoplay playsinline preload="metadata" src="${esc(u)}"></video>`;act.innerHTML+=`<a class="btn primary" href="awe-player.html?url=${encodeURIComponent(u)}&kind=video">▶ AWE Media</a><a class="btn" href="media-editor.html?url=${encodeURIComponent(u)}&name=${encodeURIComponent(x.title||'video')}">✎ Edit</a>`}else if(mtx==='audio'){pv.innerHTML=`<audio controls autoplay src="${esc(u)}"></audio>`;act.innerHTML+=`<a class="btn primary" href="awe-player.html?url=${encodeURIComponent(u)}&kind=audio">♫ AWE Media</a>`}else if(x.type==='webpage'){pv.innerHTML='<div class="hint">🌐 <b>AWE Web</b><br>A static site cannot create an independent Chromium instance inside itself. Sites that permit embedding can be viewed here; protected sites open in your normal browser.</div>';act.innerHTML+=`<a class="btn primary" href="web-player.html?url=${encodeURIComponent(u)}">🌐 AWE Web</a>`}else{pv.innerHTML='<div class="hint">📦 File resource ready.</div>'}if(u)act.innerHTML+=`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">↗ Open in browser</a>`;if(x.type==='file'||/\.(zip|7z|tar|gz|rar)(\?|$)/i.test(u))act.innerHTML+=`<a class="btn" href="https://vscode.dev/?${encodeURIComponent(u)}">⌘ VS Code Web</a>`;modal.classList.add('show')}function closeM(){modal.classList.remove('show');pv.innerHTML=''}q.oninput=render;sort.onchange=render;modal.onclick=e=>{if(e.target===modal)closeM()};document.onkeydown=e=>{if(e.key==='Escape')closeM()};load()</script></body></html>
