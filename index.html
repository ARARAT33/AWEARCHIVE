<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWELIB</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f5f8ff;color:#172033}.nav{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px;background:#ffffffb8;border-bottom:1px solid #fff;backdrop-filter:blur(22px);box-shadow:0 8px 30px #5271a512}.brand{font-weight:950;font-size:20px;text-decoration:none;color:#172033;margin-right:auto}.brand i{display:inline-grid;place-items:center;width:38px;height:38px;margin-right:8px;border-radius:13px;color:white;font-style:normal;background:linear-gradient(135deg,#20c8ff,#b56cff,#4f7cff);animation:float 3s ease-in-out infinite}.links{display:flex;gap:5px}.links a{position:relative;padding:10px 13px;border-radius:12px;text-decoration:none;color:#52627a;font-weight:900;transition:.25s;animation:in .45s both}.links a:nth-child(2){animation-delay:.05s}.links a:nth-child(3){animation-delay:.1s}.links a:nth-child(4){animation-delay:.15s}.links a:nth-child(5){animation-delay:.2s}.links a:hover{transform:translateY(-3px);background:#fff;color:#315bd9;box-shadow:0 10px 25px #5271a518}.links a:after{content:"";position:absolute;left:13px;right:13px;bottom:5px;height:2px;border-radius:9px;background:linear-gradient(90deg,#20c8ff,#b56cff);transform:scaleX(0);transition:.3s}.links a:hover:after{transform:scaleX(1)}@keyframes in{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-3px) rotate(2deg)}}main{max-width:1450px;margin:auto;padding:70px 20px}.hero{text-align:center}.hero h1{font-size:clamp(48px,8vw,90px);margin:10px 0;letter-spacing:-.06em}.hero h1 span{background:linear-gradient(100deg,#18bfe8,#6878ff,#c269ff);color:transparent;background-clip:text}.hero p{max-width:760px;margin:auto;color:#64748b;font-size:18px;line-height:1.6}.search{margin:30px auto;max-width:700px}.search input{width:100%;padding:15px 20px;border:1px solid #dce6f3;border-radius:999px;background:#fff;outline:none;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}.card{background:#ffffffc9;border:1px solid #fff;border-radius:20px;padding:18px;box-shadow:0 18px 50px #5271a51c;transition:.25s}.card:hover{transform:translateY(-6px);box-shadow:0 25px 60px #5271a528}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.links{width:100%;overflow:auto}.links a{white-space:nowrap}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a class="brand" href="/"><i>A</i>AWELIB</a><div class="links"><a href="https://awe-a2z.pages.dev/">A2Z</a><a href="https://awe-exp.pages.dev/">EXP</a><a href="https://awegame.pages.dev/">AWEGame</a><a href="https://awelib.pages.dev/">AWELib</a><a href="https://blogma-wa.blogspot.com/">Blog</a></div></nav><main><section class="hero"><small>AWE ECOSYSTEM</small><h1>Knowledge, <span>preserved.</span></h1><p>Explore the AWE archive through a lightweight, beautiful interface.</p></section><div class="search"><input id="q" placeholder="Search archive…"></div><div id="grid" class="grid"></div></main><script>const DATA='https://raw.githubusercontent.com/ARARAT33/AWEArchiveDB/main/archive.json';const grid=document.getElementById('grid'),q=document.getElementById('q');let data=[];function render(){const s=q.value.toLowerCase();grid.innerHTML=data.filter(x=>JSON.stringify(x).toLowerCase().includes(s)).map(x=>`<article class="card"><b>${x.title||x.name||'Untitled'}</b><p>${x.description||''}</p></article>`).join('')||'<p>No results.</p>'}fetch(DATA).then(r=>r.json()).then(x=>{data=x;render()}).catch(()=>grid.innerHTML='<p>Archive unavailable.</p>');q.oninput=render</script></body></html>
