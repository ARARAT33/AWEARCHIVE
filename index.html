<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="AWEARCHIVE AWELIB — searchable archive library"><title>AWEARCHIVE · AWELIB</title><style>:root{--bg:#f7f9fc;--card:#fff;--text:#14213d;--muted:#667085;--line:#e5e7eb;--accent:#0077b6;--accent2:#00b4d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1440px;margin:auto;padding:0 24px}.top{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}.nav{min-height:76px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800;color:var(--accent);text-decoration:none}.logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}.links{display:flex;gap:18px;margin-left:auto}.links a{color:#475467;font-weight:600}.search{flex:1;min-width:220px;max-width:500px;position:relative}.search input{width:100%;padding:12px 16px 12px 42px;border:1px solid #d0d5dd;border-radius:999px;outline:0}.search span{position:absolute;left:16px;top:11px}.hero{text-align:center;padding:62px 0 38px}.hero h1{font-size:clamp(34px,6vw,66px);margin:0;font-weight:850}.hero h1 i{font-style:normal;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:17px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:15px 0 24px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:999px;cursor:pointer}.chip.active{background:#e8f6fb;border-color:#8ed8ea;color:#006b9f}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #1018280a;transition:.2s;cursor:pointer}.card:hover{transform:translateY(-5px);box-shadow:0 16px 38px #0077b61a;border-color:#8ed8ea}.thumb{height:180px;background:#edf2f7;display:grid;place-items:center;font-size:48px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:16px}.type{font-size:11px;text-transform:uppercase;color:var(--accent);font-weight:800;letter-spacing:.08em}.title{font-size:17px;font-weight:750;margin:6px 0}.desc{color:var(--muted);line-height:1.45;min-height:42px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}.tag{font-size:11px;background:#f2f4f7;padding:4px 7px;border-radius:7px;color:#475467}.footer{margin:60px 0 20px;border-top:1px solid var(--line);padding:20px 0;color:var(--muted);display:flex;justify-content:space-between}.empty{text-align:center;padding:70px;color:var(--muted);grid-column:1/-1}.modal{position:fixed;inset:0;background:#10182899;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.dialog{background:#fff;max-width:900px;width:100%;max-height:90vh;overflow:auto;border-radius:22px;padding:24px}.dialoghead{display:flex;justify-content:space-between;gap:15px}.close{border:0;background:#f2f4f7;border-radius:10px;width:38px;height:38px;cursor:pointer}.preview{margin:18px 0;border-radius:14px;overflow:hidden;background:#f2f4f7;min-height:180px;display:grid;place-items:center}.preview img,.preview video{width:100%;max-height:65vh;border:0}.preview iframe{width:100%;height:65vh;border:0}.btn{display:inline-block;padding:10px 14px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;margin:4px;text-decoration:none}.state{color:var(--muted);font-size:13px}@media(max-width:1200px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.wrap{padding:0 14px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.thumb{height:130px}.hero{padding:40px 0 25px}.footer{flex-direction:column}}@media(max-width:430px){.grid{grid-template-columns:1fr}.search{order:4;max-width:none;width:100%}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="/"><span class="logo">A</span><span>AWEARCHIVE <small>· AWELIB</small></span></a><div class="links"><a href="https://blogma-wa.blogspot.com/" target="_blank" rel="noopener">✦ Blog</a></div><div class="search"><span>⌕</span><input id="q" placeholder="Search archive…"></div></div></header><main class="wrap"><section class="hero"><h1>AWEARCHIVE <i>AWELIB</i></h1><p>A permanent, searchable library of archived files, media and web pages.</p></section><div class="toolbar"><h2>Library <span id="count" class="state"></span></h2><div id="chips" class="chips"></div></div><section id="grid" class="grid"></section><footer class="footer"><span>© 2026 AWEARCHIVE · AWELIB</span><span>Archive catalog served as static content.</span></footer></main><div id="modal" class="modal"><article class="dialog"><div class="dialoghead"><div><div id="mtype" class="type"></div><h2 id="mtitle"></h2></div><button class="close" onclick="closeModal()">×</button></div><div id="preview" class="preview"></div><p id="mdesc"></p><div id="mtags" class="tags"></div><div id="mactions"></div></article></div><script>let items=[],filter='all';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){try{const r=await fetch('/data/archive.json',{cache:'no-store'});if(!r.ok)throw Error('Archive unavailable');const d=await r.json();items=Array.isArray(d)?d.filter(x=>x&&x.status!=='hidden'):[];render()}catch(e){grid.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}function render(){const qv=q.value.toLowerCase();const data=items.filter(x=>(filter==='all'||x.type===filter)&&(`${x.title} ${x.description} ${(x.tags||[]).join(' ')}`).toLowerCase().includes(qv));count.textContent=`· ${data.length} items`;grid.innerHTML=data.length?data.map(card).join(''):'<div class="empty">No archived items match your search.</div>';const types=['all',...new Set(items.map(x=>x.type).filter(Boolean))];chips.innerHTML=types.map(t=>`<button class="chip ${filter===t?'active':''}" data-type="${esc(t)}">${esc(t)}</button>`).join('');chips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.type;render()})}function card(x){const t=x.type;const thumb=x.thumbnail?`<img loading="lazy" src="${esc(x.thumbnail)}" alt="">`:(t==='video'?'▶':t==='image'?'▧':t==='webpage'?'⌁':'▤');return `<article class="card" data-id="${esc(x.id)}"><div class="thumb">${thumb}</div><div class="body"><div class="type">${esc(t)}</div><div class="title">${esc(x.title)}</div><div class="desc">${esc(x.description)}</div><div class="tags">${(x.tags||[]).slice(0,6).map(a=>`<span class="tag">#${esc(a)}</span>`).join('')}</div></div></article>`}grid.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openItem(c.dataset.id)});function openItem(id){const x=items.find(a=>a.id===id);if(!x)return;mtype.textContent=x.type||'';mtitle.textContent=x.title||'';mdesc.textContent=x.description||'';mtags.innerHTML=(x.tags||[]).map(a=>`<span class="tag">#${esc(a)}</span>`).join('');preview.innerHTML='';mactions.innerHTML='';if(x.type==='image')preview.innerHTML=`<img src="${esc(x.url)}" alt="${esc(x.title)}">`;else if(x.type==='video')preview.innerHTML=`<video controls preload="metadata" src="${esc(x.url)}"></video>`;else if(x.type==='webpage')preview.innerHTML=`<iframe sandbox="allow-forms allow-modals allow-popups allow-presentation allow-scripts" src="${esc(x.url)}"></iframe>`;else preview.innerHTML=`<div style="padding:50px;text-align:center">📦 ${esc(x.type||'file')}</div>`;if(['file','image','video'].includes(x.type))mactions.innerHTML=`<a class="btn" href="${esc(x.url)}" download>Open / Download file</a>`;else if(x.type==='webpage')mactions.innerHTML=`<a class="btn" target="_blank" rel="noopener" href="${esc(x.url)}">Open webpage</a>`;modal.classList.add('show')}function closeModal(){modal.classList.remove('show');preview.innerHTML=''}q.addEventListener('input',render);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});load();</script></body></html>
