<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWEARCHIVE · AWELIB</title><style>:root{--bg:#050a12;--p:#0b1524;--l:#20334a;--t:#eef7ff;--m:#91a7bd;--a:#20c8ff;--b:#7c5cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui}.wrap{width:min(1500px,calc(100% - 28px));margin:auto}.top{position:sticky;top:0;z-index:20;background:#050a12ed;border-bottom:1px solid #ffffff12;backdrop-filter:blur(16px)}.nav{min-height:68px;display:flex;align-items:center;gap:12px}.brand{color:#fff;font-weight:900;font-size:19px}.logo{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--a),var(--b));margin-right:8px}.search{flex:1}.search input{width:100%;padding:12px 16px;border:1px solid var(--l);border-radius:999px;background:#091523;color:#fff}.nav a{color:var(--m);font-weight:800}.hero{text-align:center;padding:65px 0 35px}.ey{color:var(--a);font-weight:900;letter-spacing:.15em;font-size:11px}.hero h1{font-size:clamp(42px,8vw,82px);line-height:.95;margin:14px 0}.hero h1 span{background:linear-gradient(100deg,var(--a),#fff,var(--b));-webkit-background-clip:text;color:transparent}.hero p{max-width:760px;margin:auto;color:var(--m);font-size:18px;line-height:1.6}.stats{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:25px 0}.stat{border:1px solid var(--l);background:var(--p);padding:9px 14px;border-radius:12px;color:var(--m)}.stat b{color:#fff}.tools{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:15px 0}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip,.select,.btn{border:1px solid var(--l);background:#102035;color:#dceeff;border-radius:9px;padding:9px 12px;cursor:pointer}.chip.active,.btn.primary{background:var(--a);color:#00131b;font-weight:900}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.card{background:var(--p);border:1px solid var(--l);border-radius:17px;overflow:hidden;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-4px);border-color:#20c8ff70}.thumb{height:175px;display:grid;place-items:center;background:#101d2e;font-size:48px;color:#56718b;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:13px}.type{color:var(--a);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.12em}.title{font-weight:900;font-size:16px;margin:6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.desc{height:42px;color:var(--m);overflow:hidden;line-height:1.4}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.tag{font-size:10px;padding:4px 7px;background:#14243a;border-radius:7px;color:#b9cee0}.empty{text-align:center;padding:80px;color:var(--m);border:1px dashed var(--l);border-radius:16px;grid-column:1/-1}.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:15px;background:#02050bd9;backdrop-filter:blur(7px)}.modal.show{display:grid}.dialog{width:min(1100px,100%);max-height:93vh;overflow:auto;background:#0a1220;border:1px solid var(--l);border-radius:22px;padding:20px}.head{display:flex;justify-content:space-between;gap:15px}.close{width:40px;height:40px;border:1px solid var(--l);background:#142238;color:#fff;border-radius:9px;font-size:22px}.preview{min-height:260px;margin:16px 0;border:1px solid var(--l);border-radius:15px;background:#03070d;display:grid;place-items:center;overflow:hidden}.preview img,.preview video,.preview audio{max-width:100%;max-height:67vh}.preview iframe{width:100%;height:67vh;border:0}.hint{padding:55px;text-align:center;color:var(--m);line-height:1.7}.actions{display:flex;gap:8px;flex-wrap:wrap}.footer{margin:55px 0 20px;padding:20px 0;border-top:1px solid var(--l);color:var(--m);display:flex;justify-content:space-between}@media(max-width:1200px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.nav{flex-wrap:wrap;padding:10px 0}.search{order:3;flex-basis:100%}.grid{grid-template-columns:repeat(2,1fr)}.thumb{height:140px}.footer{display:block}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="/"><span class="logo">A</span>AWEARCHIVE <small style="color:var(--a)">· AWELIB</small></a><div class="search"><input id="q" placeholder="Search archive…"></div><a href="admin.html">Admin</a></div></header><main class="wrap"><section class="hero"><div class="ey">AWE ARCHIVE NETWORK</div><h1>Knowledge, <span>preserved.</span></h1><p>One archive interface for media, files, webpages and development resources. AWE Player opens supported content directly in the browser.</p><div class="stats"><div class="stat"><b id="count">0</b> items</div><div class="stat"><b id="types">0</b> types</div><div class="stat"><b id="tags">0</b> tags</div></div></section><section><div class="tools"><div id="chips" class="chips"></div><select id="sort" class="select"><option value="new">Newest</option><option value="old">Oldest</option><option value="az">A–Z</option><option value="za">Z–A</option></select></div><div id="grid" class="grid"></div></section><footer class="footer"><span>© 2026 AWEARCHIVE · AWELIB</span><span>AWE Player · Media Editor · AWE Dev</span></footer></main><div id="modal" class="modal"><article class="dialog"><div class="head"><div><div id="mt" class="type"></div><h2 id="mh"></h2></div><button class="close" onclick="closeM()">×</button></div><div id="pv" class="preview"></div><p id="md" style="color:var(--m);line-height:1.6"></p><div id="mg" class="tags"></div><div id="act" class="actions" style="margin-top:15px"></div></article></div><script>const DATA='https://raw.githubusercontent.com/ARARAT33/AWEArchiveDB/main/archive.json';let items=[],filter='all';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function youtube(u){try{const x=new URL(u);if(x.hostname.includes('youtu.be'))return x.pathname.slice(1);if(x.hostname.includes('youtube.com'))return x.searchParams.get('v')||((x.pathname.match(/embed\/([^/]+)/)||[])[1]);}catch{}return null}function kind(x){const y=youtube(x.url||'');if(y)return'youtube';return x.type||'file'}async function load(){try{const r=await fetch(DATA,{cache:'no-store'});items=(await r.json()).filter(x=>x&&x.status!=='hidden');count.textContent=items.length;types.textContent=new Set(items.map(x=>x.type).filter(Boolean)).size;tags.textContent=new Set(items.flatMap(x=>x.tags||[])).size;build();render()}catch(e){grid.innerHTML='<div class="empty">Catalog unavailable.</div>'}}function build(){const a=['all',...new Set(items.map(x=>x.type).filter(Boolean))];chips.innerHTML=a.map(x=>`<button class="chip ${x===filter?'active':''}" onclick="filter='${esc(x)}';build();render()">${x==='all'?'All':esc(x)}</button>`).join('')}function render(){let qv=q.value.toLowerCase();let d=items.filter(x=>(filter==='all'||x.type===filter)&&(`${x.title} ${x.description} ${(x.tags||[]).join(' ')}`).toLowerCase().includes(qv));const s=sort.value;if(s==='az')d.sort((a,b)=>(a.title||'').localeCompare(b.title||''));if(s==='za')d.sort((a,b)=>(b.title||'').localeCompare(a.title||''));if(s==='old')d.sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0));if(s==='new')d.sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));grid.innerHTML=d.length?d.map(card).join(''):'<div class="empty">No results.</div>'}function card(x){const t=x.type||'file',ic=t==='video'?'▶':t==='image'?'▧':t==='webpage'?'🌐':t==='file'?'▤':'◆';return`<article class="card" onclick="openM('${esc(x.id)}')"><div class="thumb">${x.thumbnail?`<img src="${esc(x.thumbnail)}" loading="lazy">`:ic}</div><div class="body"><div class="type">${esc(t)}</div><div class="title">${esc(x.title)}</div><div class="desc">${esc(x.description)}</div><div class="tags">${(x.tags||[]).slice(0,5).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></div></article>`}function openM(id){const x=items.find(a=>a.id===id);if(!x)return;mt.textContent=x.type||'file';mh.textContent=x.title||'';md.textContent=x.description||'';mg.innerHTML=(x.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('');const u=x.url||'',k=kind(x),y=youtube(u);pv.innerHTML='';act.innerHTML='';if(k==='image')pv.innerHTML=`<img src="${esc(u)}" alt="">`;else if(k==='video')pv.innerHTML=`<video controls autoplay playsinline preload="metadata" src="${esc(u)}"></video>`;else if(k==='youtube'&&y)pv.innerHTML=`<iframe src="https://www.youtube.com/embed/${esc(y)}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;else if(k==='webpage')pv.innerHTML='<div class="hint">🌐 <b>WEB Player</b><br>Embedding is attempted only when the source permits framing. Otherwise use WEB ↗ for real browser navigation.</div>';else if(/\.(mp3|wav|ogg|m4a|aac|flac)(\?|$)/i.test(u))pv.innerHTML=`<audio controls autoplay src="${esc(u)}"></audio>`;else pv.innerHTML='<div class="hint">📦 File ready for AWE Player / browser.</div>';if(u)act.innerHTML+=`<a class="btn primary" href="awe-player.html?url=${encodeURIComponent(u)}">AWEpw · Open in AWE Player</a>`;if(k==='webpage'||(!['image','video','youtube'].includes(k)))act.innerHTML+=`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">🌐 WEB ↗</a>`;if(['image','video'].includes(k))act.innerHTML+=`<a class="btn" href="media-editor.html?url=${encodeURIComponent(u)}">✎ Media Editor</a>`;if(k==='file'||/\.zip(\?|$)/i.test(u))act.innerHTML+=`<a class="btn" href="awe-dev.html?url=${encodeURIComponent(u)}">⌘ AWE DEV</a>`;if(u)act.innerHTML+=`<button class="btn" onclick="cacheFile(${JSON.stringify(u)})">⬇ Cache for this browser</button>`;modal.classList.add('show')}async function cacheFile(u){try{const r=await fetch(u,{mode:'cors',credentials:'omit'});if(!r.ok)throw 0;const c=await caches.open('awearchive-cache-v1');await c.put(u,r);alert('Cached in this browser.')}catch{alert('Browser security/CORS prevents AWEARCHIVE from directly storing this remote resource. The browser may still cache it normally.')}}function closeM(){modal.classList.remove('show');pv.innerHTML=''}q.oninput=render;sort.onchange=render;modal.onclick=e=>{if(e.target===modal)closeM()};document.onkeydown=e=>{if(e.key==='Escape')closeM()};load()</script></body></html>
