<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWE Player · AWEARCHIVE</title><style>:root{--bg:#050a12;--p:#0b1524;--l:#20334a;--t:#eef7ff;--m:#91a7bd;--a:#20c8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui}.bar{position:sticky;top:0;z-index:5;background:#07101ceb;border-bottom:1px solid var(--l);padding:10px;display:flex;gap:8px}.bar input{flex:1;background:#0c1827;color:#fff;border:1px solid var(--l);border-radius:9px;padding:11px}.btn{border:1px solid var(--l);background:#122238;color:#dff6ff;border-radius:9px;padding:10px 13px;cursor:pointer}.btn.primary{background:var(--a);color:#00131b;font-weight:900}.stage{width:min(1200px,96vw);margin:18px auto}.panel{border:1px solid var(--l);background:var(--p);border-radius:16px;padding:14px}.screen{min-height:70vh;border:1px solid var(--l);border-radius:13px;background:#02060b;display:grid;place-items:center;overflow:hidden}.screen img,.screen video,.screen audio{max-width:100%;max-height:70vh}.screen iframe{width:100%;height:70vh;border:0}.hint{color:var(--m);line-height:1.6;padding:30px;text-align:center}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--m);margin-top:10px}a{color:var(--a)}</style></head><body><div class="bar"><button class="btn" onclick="history.back()">←</button><input id="url" placeholder="https://example.com/file"><button class="btn primary" onclick="openUrl()">AWEpw</button><button class="btn" onclick="external()">↗</button></div><main class="stage"><section class="panel"><div id="screen" class="screen"><div class="hint">AWE Player<br><small>Media, images, audio, PDFs and supported files can be opened here. Websites are embedded only when their security policy permits it.</small></div></div><div class="meta"><span id="status">Ready</span><span id="cache">Cache: not attempted</span></div></section></main><script>const $=x=>document.getElementById(x);const q=new URLSearchParams(location.search),initial=q.get('url')||'';url.value=initial;function kind(u){const p=new URL(u,location.href).pathname.toLowerCase();if(/\.(png|jpe?g|gif|webp|svg|avif|bmp|ico)$/.test(p))return'image';if(/\.(mp4|webm|ogv|mov|m4v)$/.test(p))return'video';if(/\.(mp3|wav|ogg|m4a|aac|flac)$/.test(p))return'audio';if(/\.pdf$/.test(p))return'pdf';if(/\.html?$/.test(p)||!/[.][a-z0-9]{1,8}$/.test(p))return'web';return'file'}async function cache(u){try{const c=await caches.open('awepw-v1');const r=await fetch(u,{mode:'cors',credentials:'omit'});if(!r.ok)throw Error('HTTP '+r.status);await c.put(u,r.clone());$('cache').textContent='Cache: saved for this browser';return r}catch(e){$('cache').textContent='Cache: browser policy prevented local caching'}}function render(u){const k=kind(u);$('status').textContent='AWE Player · '+k; if(k==='image')screen.innerHTML='<img src="'+u.replace(/"/g,'&quot;')+'" alt="">';else if(k==='video')screen.innerHTML='<video controls autoplay playsinline src="'+u.replace(/"/g,'&quot;')+'"></video>';else if(k==='audio')screen.innerHTML='<audio controls autoplay src="'+u.replace(/"/g,'&quot;')+'"></audio>';else if(k==='pdf')screen.innerHTML='<iframe src="'+u.replace(/"/g,'&quot;')+'"></iframe>';else if(k==='web')screen.innerHTML='<iframe src="'+u.replace(/"/g,'&quot;')+'" referrerpolicy="no-referrer"></iframe><div class="hint" style="position:absolute">If the site sends frame-ancestors/X-Frame-Options, the browser will block embedding. Use ↗ for direct browser navigation.</div>';else screen.innerHTML='<div class="hint">📦 Unsupported/unknown file type.<br><a href="'+u+'" target="_blank" rel="noopener">Open in browser</a></div>';cache(u)}function openUrl(){const u=url.value.trim();if(!/^https?:\/\//i.test(u))return;history.replaceState({},'',location.pathname+'?url='+encodeURIComponent(u));render(u)}function external(){if(url.value)location.href=url.value}if(initial)render(initial)</script></body></html>
