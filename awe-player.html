<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWE Media Player</title><style>:root{--bg:#050912;--p:#0a1422;--l:#1d334a;--t:#f5f9ff;--m:#8fa6bd;--a:#20c8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#12304d,#050912 45%);color:var(--t);font:15px system-ui}.bar{height:64px;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #ffffff12;background:#050912dd;backdrop-filter:blur(16px);position:sticky;top:0;z-index:5}.brand{font-weight:950;color:#fff}.url{flex:1;min-width:0;background:#0b1726;border:1px solid var(--l);color:#dff3ff;border-radius:999px;padding:11px 15px}.btn{border:1px solid var(--l);background:#0d1a2b;color:#e8f6ff;padding:9px 12px;border-radius:9px;text-decoration:none;cursor:pointer}.main{width:min(1300px,calc(100% - 28px));margin:28px auto}.stage{min-height:70vh;border:1px solid var(--l);border-radius:20px;background:#02070d;display:grid;place-items:center;overflow:hidden;box-shadow:0 25px 70px #0004}.stage img,.stage video{max-width:100%;max-height:78vh}.stage audio{width:min(800px,90%)}.info{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-top:15px;color:var(--m)}h1{font-size:24px;margin:0;color:#fff}</style></head><body><header class="bar"><span class="brand">AWE MEDIA</span><input id="u" class="url"><button class="btn" onclick="load()">Load</button><a class="btn" href="index.html">Archive</a></header><main class="main"><section id="stage" class="stage"></section><div class="info"><h1>AWE Media Player</h1><span id="meta"></span></div></main><script>const p=new URLSearchParams(location.search),url=p.get('url')||'',kind=p.get('kind')||'';u.value=url;function type(){if(kind)return kind;try{const e=new URL(url).pathname.split('.').pop().toLowerCase();if(['jpg','jpeg','png','gif','webp','svg','avif','bmp'].includes(e))return'image';if(['mp4','webm','ogv','mov','m4v'].includes(e))return'video';if(['mp3','wav','ogg','m4a','aac','flac'].includes(e))return'audio'}catch{}return'unknown'}function load(){const x=u.value.trim();if(!x)return;location.href='awe-player.html?url='+encodeURIComponent(x)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function render(){const t=type();meta.textContent=t.toUpperCase();if(!url){stage.innerHTML='<div style="color:#8fa6bd;padding:50px">No media URL supplied.</div>';return}if(t==='image')stage.innerHTML=`<img src="${esc(url)}" alt="">`;else if(t==='video')stage.innerHTML=`<video src="${esc(url)}" controls autoplay playsinline preload="metadata"></video>`;else if(t==='audio')stage.innerHTML=`<audio src="${esc(url)}" controls autoplay></audio>`;else stage.innerHTML='<div style="color:#8fa6bd;padding:50px;text-align:center">Not a supported media resource.<br><br><a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener">Open in browser ↗</a></div>'}render()</script></body></html>
