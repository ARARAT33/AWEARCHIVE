<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWEARCHIVE Admin</title><style>body{margin:0;background:#0b1220;color:#eef2f7;font:15px system-ui}.wrap{max-width:1180px;margin:auto;padding:28px}.card{background:#111a2b;border:1px solid #26334b;border-radius:18px;padding:22px;margin:16px 0}input,textarea,select{width:100%;padding:11px;margin:6px 0 12px;border-radius:9px;border:1px solid #34435d;background:#0b1220;color:#fff;box-sizing:border-box}button,.btn{padding:10px 14px;border:0;border-radius:9px;background:#00a6d6;color:#fff;font-weight:700;cursor:pointer;margin:4px}.danger{background:#b42318}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.item{padding:13px;border:1px solid #26334b;border-radius:12px;margin:8px 0}.muted{color:#98a5b8}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="row"><h1>⚙ AWEARCHIVE Admin</h1><button id="logout" class="hidden">Sign out</button></div><section id="login" class="card"><h2>Private administration</h2><p class="muted">Authentication is handled by Supabase Auth. No password is stored in this HTML.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button><p id="err"></p></section><section id="app" class="hidden"><div class="grid"><div class="card"><h2>Add / edit archive item</h2><input id="id" type="hidden"><label>Title</label><input id="title"><label>Slug</label><input id="slug" placeholder="my-file"><label>Description</label><textarea id="description" rows="4"></textarea><label>Type</label><select id="type"><option>file</option><option>video</option><option>image</option><option>webpage</option><option>other</option></select><label>Source URL</label><input id="source"><label>Thumbnail URL (optional)</label><input id="thumb"><label>Tags (comma separated)</label><input id="tags"><button onclick="save()">Save item</button><button onclick="clearForm()">Clear</button></div><div class="card"><h2>Library management</h2><input id="filter" oninput="render()" placeholder="Filter items"><div id="list"></div></div></div></section></main><script>const SUPABASE_URL='__SUPABASE_URL__',SUPABASE_KEY='__SUPABASE_PUBLISHABLE_KEY__';let token='',items=[];const H=()=>({apikey:SUPABASE_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'});async function login(){const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok){err.textContent=d.msg||d.error_description||'Login failed';return}token=d.access_token;login.classList.add('hidden');app.classList.remove('hidden');logout.classList.remove('hidden');load()}async function load(){const r=await fetch(SUPABASE_URL+'/rest/v1/archive_items?select=*&order=created_at.desc',{headers:H()});items=await r.json();render()}function render(){const q=filter.value.toLowerCase();list.innerHTML=items.filter(x=>(x.title+' '+x.slug).toLowerCase().includes(q)).map(x=>`<div class="item"><b>${esc(x.title)}</b><div class="muted">${esc(x.item_type)} · ${esc(x.slug)}</div><button onclick="edit('${x.id}')">Edit</button><button class="danger" onclick="del('${x.id}')">Delete</button></div>`).join('')||'<p class="muted">No items.</p>'}function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function edit(id){let x=items.find(a=>a.id===id);for(const k of ['id','title','slug','description','type','source','thumb'])document.getElementById(k).value=x[k==='type'?'item_type':k==='source'?'source_url':k==='thumb'?'thumbnail_url':k]||'';tags.value=(x.tags||[]).join(',')}function clearForm(){['id','title','slug','description','source','thumb','tags'].forEach(k=>document.getElementById(k).value='');type.value='file'}async function save(){const payload={title:title.value,slug:slug.value,description:description.value,item_type:type.value,source_url:source.value,thumbnail_url:thumb.value||null,tags:tags.value.split(',').map(x=>x.trim()).filter(Boolean),status:'active'};let url=SUPABASE_URL+'/rest/v1/archive_items',method='POST',headers={...H(),'Prefer':'return=representation'};if(id.value){url+="?id=eq."+encodeURIComponent(id.value);method='PATCH'}const r=await fetch(url,{method,headers,body:JSON.stringify(payload)});if(!r.ok){alert(await r.text());return}clearForm();load()}async function del(i){if(!confirm('Delete this archive item?'))return;await fetch(SUPABASE_URL+'/rest/v1/archive_items?id=eq.'+encodeURIComponent(i),{method:'DELETE',headers:H()});load()}logout.onclick=()=>{token='';app.classList.add('hidden');login.classList.remove('hidden');logout.classList.add('hidden')};</script></body></html>
