<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>AWEARCHIVE · Private Admin</title><style>:root{--bg:#07111f;--card:#0d1a2c;--line:#1d3049;--text:#eef6ff;--muted:#8fa4bd;--a:#18b7e8;--danger:#ff5b67;--ok:#37d69a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#10243b,#07111f 55%);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1550px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-size:22px;font-weight:850}.muted{color:var(--muted)}.card{background:#0d1a2cf2;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 35px #0005}.login{max-width:430px;margin:12vh auto}.input,textarea,select{width:100%;padding:11px 12px;margin:6px 0 12px;border:1px solid #29415e;border-radius:10px;background:#07111f;color:#fff;outline:none}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--a);color:#00131c;font-weight:800;cursor:pointer}.btn.alt{background:#17304a;color:#d9effa}.btn.danger{background:var(--danger);color:#fff}.btn.ok{background:var(--ok);color:#052016}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:12px}.stat b{display:block;font-size:28px;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:14px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}.scroll{max-height:650px;overflow:auto}.item{padding:11px;border:1px solid var(--line);border-radius:12px;margin:7px 0}.item.selected{border-color:var(--a);box-shadow:0 0 0 1px #18b7e833}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.pill{display:inline-block;padding:3px 7px;border-radius:99px;background:#17304a;color:#b9e9f7;font-size:11px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.toolbar .input{max-width:320px;margin:0}.preview{background:#07111f;border:1px solid var(--line);border-radius:14px;min-height:260px;display:grid;place-items:center;overflow:hidden;margin-top:12px}.preview img,.preview video{max-width:100%;max-height:420px}.preview iframe{width:100%;height:420px;border:0}.dangerText{color:var(--danger)}small{color:var(--muted)}@media(max-width:1050px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.wrap{padding:12px}.twocol{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}</style></head><body><div id="login" class="wrap login"><div class="card"><h1>AWEARCHIVE Admin</h1><p class="muted">Private control plane. No public admin link.</p><input id="username" class="input" autocomplete="username" placeholder="Username"><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Password"><button class="btn" onclick="signin()">Enter Admin</button><p id="loginErr" class="dangerText"></p></div></div><div id="app" class="wrap hidden"><header class="top"><div><div class="brand">⚙ AWEARCHIVE Control Center</div><small>Private GitHub-backed catalog manager</small></div><div><button class="btn alt" onclick="refresh()">Refresh</button> <button class="btn alt" onclick="downloadCatalog()">Export JSON</button> <button class="btn danger" onclick="signout()">Sign out</button></div></header><section class="stats"><div class="card stat"><small>Total</small><b id="total">0</b></div><div class="card stat"><small>Active</small><b id="active">0</b></div><div class="card stat"><small>Hidden</small><b id="hiddenN">0</b></div><div class="card stat"><small>Types</small><b id="typesN">0</b></div><div class="card stat"><small>Tags</small><b id="tagsN">0</b></div></section><div class="grid"><section><div class="card"><div class="row"><h2 id="formTitle">Add archive item</h2><button class="btn alt" onclick="clearForm()">New</button></div><input id="id" type="hidden"><label>Title</label><input id="title" class="input" maxlength="240"><label>Slug</label><input id="slug" class="input" maxlength="120"><label>Description</label><textarea id="description" rows="4" maxlength="5000"></textarea><div class="twocol"><div><label>Type</label><select id="type" class="input"><option value="file">File</option><option value="video">Video</option><option value="image">Image</option><option value="webpage">Webpage</option><option value="other">Other</option></select></div><div><label>Status</label><select id="status" class="input"><option value="active">Active</option><option value="hidden">Hidden</option></select></div></div><label>Source URL</label><input id="url" class="input" type="url" placeholder="https://..."><label>Thumbnail URL (optional)</label><input id="thumbnail" class="input" type="url"><label>Tags</label><input id="tags" class="input" maxlength="1000" placeholder="history, archive, video"><div><button class="btn" onclick="saveItem()">Save / Publish</button> <button class="btn alt" onclick="previewForm()">Preview</button> <button class="btn alt" onclick="clearForm()">Clear</button></div><p id="saveMsg" class="muted"></p><div id="formPreview" class="preview hidden"></div></div></section><section><div class="card"><div class="row"><h2>Library management</h2><span id="selection" class="pill">0 selected</span></div><div class="toolbar"><input id="filter" class="input" placeholder="Search title, slug, tags…" oninput="render()"><select id="typeFilter" class="input" onchange="render()" style="max-width:180px"><option value="all">All types</option><option value="file">File</option><option value="video">Video</option><option value="image">Image</option><option value="webpage">Webpage</option><option value="other">Other</option></select><select id="statusFilter" class="input" onchange="render()" style="max-width:180px"><option value="all">All status</option><option value="active">Active</option><option value="hidden">Hidden</option></select></div><div class="toolbar"><button class="btn alt" onclick="selectAll(true)">Select visible</button><button class="btn alt" onclick="selectAll(false)">Clear selection</button><button class="btn danger" onclick="deleteSelected()">Delete selected</button></div><div id="library" class="scroll"></div></div></section></div></div><script>let items=[],selected=new Set();const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function signin(){loginErr.textContent='';const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json().catch(()=>({}));if(!r.ok){loginErr.textContent=d.error||'Login failed';return}login.classList.add('hidden');app.classList.remove('hidden');await refresh()}async function signout(){await fetch('/api/admin/logout',{method:'POST'});location.reload()}async function api(path,opt){const r=await fetch(path,opt);if(r.status===401){login.classList.remove('hidden');app.classList.add('hidden');throw Error('Session expired')}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function refresh(){try{const d=await api('/api/admin');items=Array.isArray(d.items)?d.items:[];renderStats();render()}catch(e){if(e.message!=='Session expired')alert(e.message)}}function renderStats(){total.textContent=items.length;active.textContent=items.filter(x=>x.status!=='hidden').length;hiddenN.textContent=items.filter(x=>x.status==='hidden').length;typesN.textContent=new Set(items.map(x=>x.type).filter(Boolean)).size;tagsN.textContent=new Set(items.flatMap(x=>Array.isArray(x.tags)?x.tags:[])).size}function visible(){const q=filter.value.toLowerCase(),tf=typeFilter.value,sf=statusFilter.value;return items.filter(x=>(!q||`${x.title} ${x.slug} ${x.description} ${(x.tags||[]).join(' ')}`.toLowerCase().includes(q))&&(tf==='all'||x.type===tf)&&(sf==='all'||(x.status||'active')===sf))}function render(){const v=visible();selection.textContent=`${selected.size} selected`;library.innerHTML=v.length?v.map(x=>`<div class="item ${selected.has(x.id)?'selected':''}"><div class="row"><label><input type="checkbox" ${selected.has(x.id)?'checked':''} onchange="toggle('${esc(x.id)}',this.checked)"> <b>${esc(x.title)}</b></label><span class="pill">${esc(x.type)} · ${esc(x.status||'active')}</span></div><small>${esc(x.slug)} · ${(x.tags||[]).map(t=>'#'+esc(t)).join(' ')}</small><div style="margin-top:8px"><button class="btn alt" onclick="editItem('${esc(x.id)}')">Edit</button><button class="btn alt" onclick="duplicateItem('${esc(x.id)}')">Duplicate</button><button class="btn danger" onclick="deleteOne('${esc(x.id)}')">Delete</button></div></div>`).join(''):'<p class="muted">No matching items.</p>'}function toggle(id,on){on?selected.add(id):selected.delete(id);render()}function selectAll(on){visible().forEach(x=>on?selected.add(x.id):selected.delete(x.id));render()}async function deleteOne(id){if(!confirm('Delete this archive record permanently?'))return;try{await api('/api/admin',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});selected.delete(id);await refresh()}catch(e){alert(e.message)}}async function deleteSelected(){const ids=[...selected];if(!ids.length)return alert('Select at least one item.');if(!confirm(`Delete ${ids.length} selected archive records permanently?`))return;try{await api('/api/admin',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});selected.clear();await refresh()}catch(e){alert(e.message)}}function editItem(i){const x=items.find(a=>a.id===i);if(!x)return;id.value=x.id;title.value=x.title||'';slug.value=x.slug||'';description.value=x.description||'';type.value=x.type||'file';status.value=x.status||'active';url.value=x.url||'';thumbnail.value=x.thumbnail||'';tags.value=(x.tags||[]).join(',');formTitle.textContent='Edit archive item';window.scrollTo({top:0,behavior:'smooth'})}function duplicateItem(i){const x=items.find(a=>a.id===i);if(!x)return;clearForm();title.value=`${x.title} Copy`;slug.value=`${x.slug}-copy`;description.value=x.description||'';type.value=x.type||'file';status.value='active';url.value=x.url||'';thumbnail.value=x.thumbnail||'';tags.value=(x.tags||[]).join(',');formTitle.textContent='Duplicate archive item';window.scrollTo({top:0,behavior:'smooth'})}function clearForm(){['id','title','slug','description','url','thumbnail','tags'].forEach(k=>$(k).value='');type.value='file';status.value='active';formTitle.textContent='Add archive item';saveMsg.textContent='';formPreview.classList.add('hidden');formPreview.innerHTML=''}function payload(){return{id:id.value||undefined,title:title.value.trim(),slug:slug.value.trim(),description:description.value.trim(),type:type.value,status:status.value,url:url.value.trim(),thumbnail:thumbnail.value.trim(),tags:tags.value.split(',').map(x=>x.trim()).filter(Boolean)}}async function saveItem(){saveMsg.textContent='Saving…';try{const d=await api('/api/admin',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});saveMsg.textContent=`Saved: ${d.action}. GitHub commit created.`;await refresh()}catch(e){saveMsg.textContent=e.message}}function previewForm(){const x=payload();if(!x.url)return alert('Enter a URL first.');formPreview.classList.remove('hidden');if(x.type==='image')formPreview.innerHTML=`<img src="${esc(x.url)}" alt="${esc(x.title)}">`;else if(x.type==='video')formPreview.innerHTML=`<video controls src="${esc(x.url)}"></video>`;else if(x.type==='webpage')formPreview.innerHTML=`<iframe src="${esc(x.url)}"></iframe>`;else formPreview.innerHTML=`<div style="padding:70px">📦 ${esc(x.type)}<br><small>${esc(x.url)}</small></div>`}function downloadCatalog(){const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`awearchive-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)} </script></body></html>
