<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWEpw Browser</title><style>:root{color-scheme:dark;--bg:#070b12;--bar:#0c1320;--line:#223044;--text:#eaf4ff;--muted:#8fa4ba;--accent:#20c8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}.tabs{height:36px;display:flex;align-items:end;background:#05080d;padding:0 8px;gap:4px;border-bottom:1px solid var(--line)}.tab{height:32px;min-width:150px;max-width:260px;padding:0 9px;border:1px solid transparent;border-radius:9px 9px 0 0;background:#0a1019;color:var(--muted);display:flex;align-items:center;gap:8px;cursor:pointer}.tab.active{background:var(--bar);color:var(--text);border-color:var(--line);border-bottom-color:var(--bar)}.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.x{opacity:.6}.new{height:28px;width:28px;border:0;background:transparent;color:#fff;font-size:20px;cursor:pointer}.toolbar{height:40px;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:5px 8px}.tool{width:30px;height:30px;border:0;border-radius:7px;background:#131e2d;color:#dcecff;cursor:pointer;font-size:16px}.tool:disabled{opacity:.3}.url{height:30px;flex:1;border:1px solid var(--line);border-radius:999px;background:#08101b;color:#fff;padding:0 15px;outline:0}.url:focus{border-color:#20c8ff66;box-shadow:0 0 0 3px #20c8ff12}.status{font-size:11px;color:var(--muted);padding:0 6px}.menu{position:relative}.menu button{font-size:20px}</style></head><body><div id="tabs" class="tabs"></div><div class="toolbar"><button id="back" class="tool" title="Back">←</button><button id="forward" class="tool" title="Forward">→</button><button id="reload" class="tool" title="Reload">↻</button><button id="home" class="tool" title="Home">⌂</button><input id="url" class="url" spellcheck="false" placeholder="Search or enter address"><span id="status" class="status"></span><button id="dev" class="tool" title="DevTools">⌘</button></div><script>const $=id=>document.getElementById(id);let S={tabs:[],activeId:0};function render(){tabs.innerHTML=S.tabs.map(t=>`<div class="tab ${t.id===S.activeId?'active':''}" data-id="${t.id}"><span>${esc(t.title||'New tab')}</span><b class="x" data-close="${t.id}">×</b></div>`).join('')+'<button class="new" id="new">+</button>';const a=S.tabs.find(t=>t.id===S.activeId);url.value=a?.url||'';back.disabled=!a?.canGoBack;forward.disabled=!a?.canGoForward;status.textContent=a?.loading?'Loading…':'AWEpw';document.title=(a?.title||'AWEpw Browser')+' · AWEpw'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}awepw.state(x=>{S=x;render()});tabs.onclick=e=>{const c=e.target.closest('[data-close]');if(c){awepw.close(c.dataset.close);return}const t=e.target.closest('[data-id]');if(t)awepw.activate(t.dataset.id)};new.onclick=()=>awepw.newTab('https://www.google.com/');back.onclick=()=>awepw.back();forward.onclick=()=>awepw.forward();reload.onclick=()=>awepw.reload();home.onclick=()=>awepw.navigate('https://www.google.com/');dev.onclick=()=>awepw.devtools();url.addEventListener('keydown',e=>{if(e.key==='Enter')awepw.navigate(url.value)});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='l'){e.preventDefault();url.focus();url.select()}if((e.ctrlKey||e.metaKey)&&e.key==='t'){e.preventDefault();awepw.newTab('https://www.google.com/')}if((e.ctrlKey||e.metaKey)&&e.key==='w'){e.preventDefault();awepw.close(S.activeId)}if(e.key==='F12')awepw.devtools()});</script></body></html>
