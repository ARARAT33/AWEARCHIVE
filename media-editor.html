<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWE Media Editor</title><style>body{margin:0;background:#050a12;color:#eef7ff;font:14px system-ui}.bar{padding:10px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #20334a;position:sticky;top:0;background:#07101eee;z-index:2}button{padding:9px 12px;border-radius:9px;border:1px solid #20334a;background:#122238;color:#fff;cursor:pointer}.stage{display:grid;place-items:center;min-height:65vh;padding:18px}.stage img,.stage video{max-width:92vw;max-height:65vh}.info{padding:12px;color:#91a7bd;text-align:center}canvas{max-width:92vw;max-height:65vh}</style></head><body><div class="bar"><input id="file" type="file" accept="image/*,video/*"><button onclick="rotate()">↻ Rotate</button><button onclick="filter('grayscale(1)')">B&W</button><button onclick="filter('sepia(1)')">Sepia</button><button onclick="filter('none')">Reset</button><button onclick="downloadImage()">Save image</button><button onclick="recordVideo()">Export video</button></div><div class="stage" id="stage"><div class="info">Choose an image or video. Editing is local to this browser; the original is never changed.</div></div><div class="info">The exported file is downloaded/created only for this user. It is not published back to the archive automatically.</div><script>let f,el,angle=0,fx='none';file.onchange=()=>{f=file.files[0];if(!f)return;const u=URL.createObjectURL(f);stage.innerHTML='';if(f.type.startsWith('image/')){el=new Image();el.onload=()=>stage.appendChild(el);el.src=u}else{el=document.createElement('video');el.controls=true;el.playsInline=true;el.src=u;stage.appendChild(el)}};function apply(){if(!el)return;el.style.filter=fx;el.style.transform='rotate('+angle+'deg)'}function rotate(){angle=(angle+90)%360;apply()}function filter(x){fx=x;apply()}function downloadImage(){if(!f||!f.type.startsWith('image/'))return alert('Choose an image');const c=document.createElement('canvas'),ctx=c.getContext('2d'),w=el.naturalWidth,h=el.naturalHeight;c.width=angle%180?h:w;c.height=angle%180?w:h;ctx.filter=fx;ctx.translate(c.width/2,c.height/2);ctx.rotate(angle*Math.PI/180);ctx.drawImage(el,-w/2,-h/2);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='awe-edited-'+f.name;a.click()})}async function recordVideo(){if(!f||!f.type.startsWith('video/'))return alert('Choose a video');if(!el.captureStream||!window.MediaRecorder)return alert('This browser does not support local video export');const s=el.captureStream();const chunks=[];const r=new MediaRecorder(s);r.ondataavailable=e=>e.data.size&&chunks.push(e.data);r.onstop=()=>{const b=new Blob(chunks,{type:r.mimeType||'video/webm'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='awe-edited-'+f.name.replace(/\.[^.]+$/,'')+'.webm';a.click()};r.start();el.play();setTimeout(()=>r.stop(),Math.min(10000,(el.duration||10)*1000))}</script></body></html>
