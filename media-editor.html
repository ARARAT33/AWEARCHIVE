<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWE Media Editor</title><style>:root{--bg:#050912;--p:#0a1422;--l:#1d334a;--t:#eef7ff;--m:#8fa6bd;--a:#20c8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#12304d,#050912 48%);color:var(--t);font:14px system-ui}.bar{padding:10px;display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid #ffffff12;position:sticky;top:0;background:#07101eee;z-index:2;backdrop-filter:blur(16px)}button,.btn{padding:9px 12px;border-radius:9px;border:1px solid var(--l);background:#122238;color:#fff;cursor:pointer;text-decoration:none}.primary{background:var(--a);color:#00131b;font-weight:900}.stage{display:grid;place-items:center;min-height:68vh;padding:18px}.stage img,.stage video{max-width:92vw;max-height:68vh}.info{padding:12px;color:var(--m);text-align:center}.url{flex:1;min-width:240px;background:#091725;border:1px solid var(--l);color:#fff;border-radius:999px;padding:10px 14px}</style></head><body><div class="bar"><input id="url" class="url" placeholder="Media URL"><button class="primary" onclick="loadUrl()">Load</button><input id="file" type="file" accept="image/*,video/*"><button onclick="rotate()">↻ Rotate</button><button onclick="flip()">↔ Flip</button><button onclick="adjust('grayscale(1)')">B&W</button><button onclick="adjust('sepia(1)')">Sepia</button><button onclick="adjust('brightness(1.2)')">Bright+</button><button onclick="adjust('contrast(1.2)')">Contrast+</button><button onclick="resetFx()">Reset</button><button onclick="saveImage()">Save image</button><button onclick="exportVideo()">Export video</button><a class="btn" href="index.html">Archive</a></div><div class="stage" id="stage"><div class="info">Open an image/video from AWEARCHIVE. Editing is local to this browser; the archive original is never modified.</div></div><div class="info" id="note">Remote image export requires CORS permission. Video export uses browser MediaRecorder when supported.</div><script>const p=new URLSearchParams(location.search);let src=p.get('url')||'',name=p.get('name')||'media',f=null,el=null,angle=0,flipX=1,fx='none';url.value=src;file.onchange=()=>{f=file.files[0];if(f)mount(URL.createObjectURL(f),f.type,f.name)};function loadUrl(){src=url.value.trim();if(!src)return;let e='';try{e=new URL(src).pathname.split('.').pop().toLowerCase()}catch{}const t=['jpg','jpeg','png','gif','webp','svg','avif','bmp'].includes(e)?'image/*':['mp4','webm','ogv','mov','m4v'].includes(e)?'video/*':'';mount(src,t,name)}function mount(u,t,n){stage.innerHTML='';angle=0;flipX=1;fx='none';if(t.startsWith('image/')){el=new Image();el.crossOrigin='anonymous';el.onload=()=>stage.appendChild(el);el.onerror=()=>{el.crossOrigin='';el.src=u};el.src=u}else if(t.startsWith('video/')){el=document.createElement('video');el.controls=true;el.playsInline=true;el.preload='metadata';el.src=u;stage.appendChild(el)}else{stage.innerHTML='<div class="info">Unsupported media type. Open it with AWE Media Player.</div>';el=null}apply()}function apply(){if(!el)return;el.style.filter=fx;el.style.transform=`rotate(${angle}deg) scaleX(${flipX})`}function rotate(){if(!el)return;angle=(angle+90)%360;apply()}function flip(){if(!el)return;flipX*=-1;apply()}function adjust(x){if(!el)return;fx=x;apply()}function resetFx(){if(!el)return;fx='none';angle=0;flipX=1;apply()}function saveImage(){if(!el||el.tagName!=='IMG')return alert('Open an image first');const c=document.createElement('canvas'),ctx=c.getContext('2d'),w=el.naturalWidth,h=el.naturalHeight;c.width=angle%180?h:w;c.height=angle%180?w:h;ctx.filter=fx;ctx.translate(c.width/2,c.height/2);ctx.scale(flipX,1);ctx.rotate(angle*Math.PI/180);ctx.drawImage(el,-w/2,-h/2);c.toBlob(b=>{if(!b)return alert('Export blocked. The remote image may not allow CORS.');const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='awe-edited-'+name.replace(/\.[^.]+$/,'')+'.png';a.click()},'image/png')}async function exportVideo(){if(!el||el.tagName!=='VIDEO')return alert('Open a video first');if(!el.captureStream||!window.MediaRecorder)return alert('This browser does not support browser video export');const stream=el.captureStream(),chunks=[],r=new MediaRecorder(stream);r.ondataavailable=e=>e.data.size&&chunks.push(e.data);r.onstop=()=>{const b=new Blob(chunks,{type:r.mimeType||'video/webm'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='awe-edited-'+name.replace(/\.[^.]+$/,'')+'.webm';a.click()};r.start();try{await el.play()}catch{}const left=Number.isFinite(el.duration)?Math.min(15000,Math.max(1000,(el.duration-el.currentTime)*1000)):10000;setTimeout(()=>{r.stop();el.pause()},left)}if(src)loadUrl()</script></body></html>
