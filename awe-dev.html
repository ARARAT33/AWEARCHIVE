<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWE Dev · AWEARCHIVE</title><style>html,body{margin:0;height:100%;background:#0b0f14;color:#fff;font:13px system-ui}.top{height:48px;display:flex;gap:8px;align-items:center;padding:0 10px;background:#111821;border-bottom:1px solid #263443}.btn{padding:8px 11px;border:1px solid #2b3b4d;border-radius:7px;background:#17212d;color:#fff;cursor:pointer}.main{height:calc(100% - 49px);display:grid;grid-template-columns:240px 1fr}.files{overflow:auto;border-right:1px solid #263443;padding:8px}.file{padding:8px;border-radius:6px;cursor:pointer}.file:hover,.file.active{background:#1b2a39}.editor{min-width:0}#monaco{width:100%;height:100%}</style></head><body><div class="top"><b>⌘ AWE DEV</b><input id="zip" type="file" accept=".zip,.json,.txt,.html,.css,.js,.ts,.md,.py,.rs"><button class="btn" onclick="download()">Save file</button><span id="state"></span></div><div class="main"><aside id="files" class="files"></aside><section class="editor"><div id="monaco"></div></section></div><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script><script>let ed,active='main.txt',data={'main.txt':''};require.config({paths:{vs:'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs'}});require(['vs/editor/editor.main'],()=>{ed=monaco.editor.create(document.getElementById('monaco'),{value:'',language:'plaintext',theme:'vs-dark',automaticLayout:true,minimap:{enabled:true}});open('main.txt')});function lang(n){const e=n.split('.').pop();return {js:'javascript',ts:'typescript',html:'html',css:'css,json:'json',md:'markdown',py:'python',rs:'rust' }[e]||'plaintext'}function open(n){if(ed){data[active]=ed.getValue();active=n;ed.setValue(data[n]||'');monaco.editor.setModelLanguage(ed.getModel(),lang(n));state.textContent=n}render()}function render(){files.innerHTML=Object.keys(data).map(n=>'<div class="file '+(n===active?'active':'')+'" onclick="open('+JSON.stringify(n)+')">'+n+'</div>').join('')}zip.onchange=async()=>{const f=zip.files[0];if(!f)return;if(f.name.toLowerCase().endsWith('.zip')){const z=await JSZip.loadAsync(f);data={};for(const n of Object.keys(z.files)){if(!z.files[n].dir)data[n]=await z.files[n].async('string')}open(Object.keys(data)[0]||'main.txt')}else{data[f.name]=await f.text();open(f.name)}};function download(){if(!ed)return;data[active]=ed.getValue();const b=new Blob([data[active]],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=active.split('/').pop();a.click()}</script></body></html>
